# This config is generated by GPT-5.6 Sol. Use with caution.

name: Update AUR packages

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '*/*'
      - '.github/workflows/update-packages.yaml'

concurrency:
  group: aur-package-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: ${{ github.event.repository.default_branch }}
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
      AUR_GIT_NAME: ${{ vars.AUR_GIT_NAME }}
      AUR_GIT_EMAIL: ${{ vars.AUR_GIT_EMAIL }}

    steps:
      - name: Install tooling
        run: >-
          pacman -Syu --noconfirm --needed
          git github-cli jq namcap openssh pacman-contrib sudo 7zip

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Update and publish packages
        shell: bash
        run: |
          mapfile -t packages < <(
            find . -mindepth 2 -maxdepth 2 -name PKGBUILD -printf '%h\n' |
              sed 's|^\./||' |
              sort
          )

          if ((${#packages[@]} == 0)); then
            echo 'No package directories found'
            exit 0
          fi

          for package in "${packages[@]}"; do
            bash scripts/pkg-all.sh "$package"
          done
